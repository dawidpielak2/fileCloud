workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "gitlab-ci-test"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - test
  - build
  - integration

variables:
  GIT_DEPTH: "0" # ensures full repository access for gitleaks
  NODE_VERSION: "20"
  SERVER_PORT: "5000"

# ==========================================
# TEST
# ==========================================
lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run lint

gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --report-path=gitleaks-report.json --verbose
  artifacts:
    name: "gitleaks-report-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days

test_unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run test:unit
  artifacts:
    when: always
    reports:
      junit: backend/test-report.xml
    paths:
      - backend/coverage/
    expire_in: 7 days

npm_audit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd backend
    - npm audit --audit-level=high
  allow_failure: true

# ==========================================
# BUILD
# ==========================================

build_backend:
  stage: build
  image: docker:latest
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - if [ "$CI_COMMIT_BRANCH" == "main" ]; then docker push $CI_REGISTRY_IMAGE/backend --all-tags; fi

# ==========================================
# INTEGRATION
# ==========================================

run_integration_tests:
  stage: integration
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TEST_TARGET_URL: "http://docker:5000"
    BIND_IP: "0.0.0.0"
  before_script:
    - apk add --no-cache nodejs npm docker-cli-compose
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - npm install --prefix backend
  script:
    - docker compose up -d --wait
    - npm run test:integration --prefix backend
  after_script:
    - docker compose down -v
