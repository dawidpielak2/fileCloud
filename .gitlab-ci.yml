stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "20"

lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install 
    - npm run lint 
  rules:
    - if: $CI_COMMIT_BRANCH == "main" 
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" 
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run test
  artifacts:
    when: always
    reports:
      junit: backend/test-report.xml
    paths:
      - backend/coverage/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build_backend:
  stage: build
  image: docker:latest 
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - if [ "$CI_COMMIT_BRANCH" == "main" ]; then docker push $CI_REGISTRY_IMAGE/backend --all-tags; fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

run_integration_tests:
  stage: test-integration
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TEST_TARGET_URL: "http://docker:5000"
  before_script:
    - apk add --no-cache nodejs npm docker-cli-compose
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - npm install --prefix backend
  script:
    - docker compose up -d
    - sleep 20
    - npm run test:integration --prefix backend
  after_script:
    - docker compose down -v
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
