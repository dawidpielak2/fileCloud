workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "gitlab-ci-test"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - test
  - build
  - integration

variables:
  GIT_DEPTH: "0" # ensures full repository access for gitleaks
  NODE_VERSION: "20"
  SERVER_PORT: "5000"

# ==========================================
# TEST
# ==========================================
lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run lint

gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --report-path=gitleaks-report.json --verbose
  artifacts:
    name: "gitleaks-report-${CI_COMMIT_SHORT_SHA}"
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days

test_unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  cache:
    key: backend-depts
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run test:unit
  artifacts:
    when: always
    reports:
      junit: backend/test-report.xml
    paths:
      - backend/coverage/
    expire_in: 7 days

npm_audit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd backend
    - npm audit --audit-level=high
  allow_failure: true

# ==========================================
# BUILD
# ==========================================

build_backend:
  stage: build
  image: docker:latest
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - if [ "$CI_COMMIT_BRANCH" == "main" ]; then docker push $CI_REGISTRY_IMAGE/backend --all-tags; fi

# ==========================================
# INTEGRATION
# ==========================================

run_integration_tests:
  stage: integration
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    TEST_TARGET_URL: "http://docker:5000"
    BIND_IP: "0.0.0.0"
  before_script:
    - apk add --no-cache nodejs npm docker-cli-compose
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - npm install --prefix backend
  script:
    - docker compose up -d --wait
    - npm run test:integration --prefix backend
  after_script:
    - docker compose down -v

dast_scan:
  stage: integration
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    BIND_IP: "0.0.0.0"
  allow_failure: true
  before_script:
    - apk add --no-cache docker-cli-compose curl jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker compose up -d --wait

    # Fetch JWT access token from Keycloak for authentication
    - >
      ACCESS_TOKEN=$(curl -s -X POST "http://docker:8080/realms/file-cloud/protocol/openid-connect/token" \
        -H "Host: localhost:8080" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=password&client_id=file-cloud-client&username=test-user&password=test-user" | jq -r .access_token)

    - |
      if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
        echo "Error: Failed to retrieve JWT token from Keycloak!"
        exit 1
      fi

    # Run OWASP ZAP and injected Bearer token
    - >
      docker run --name zap-scanner --network host \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py --autooff -t http://docker:5000/api/auth/me \
        -r zap-report.html \
        -J zap-report.json \
        -I \
        -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).replacement=\"Bearer ${ACCESS_TOKEN}\"" || true

    # Copy generated reports from DinD container to the runner workspace
    - docker cp zap-scanner:/zap/wrk/zap-report.html ./zap-report.html || docker cp zap-scanner:/zap/zap-report.html ./zap-report.html || true
    - docker cp zap-scanner:/zap/wrk/zap-report.json ./zap-report.json || docker cp zap-scanner:/zap/zap-report.json ./zap-report.json || true
    - docker rm zap-scanner || true

  after_script:
    - docker compose down -v
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 7 days
